<header class="capa" [style.--matiz]="d().matiz" [style.--capa]="capa()">
  <div class="conteudo">
    <span class="selo" aria-hidden="true">{{ sigla() }}</span>
    <div>
      <p class="curso">{{ d().curso }}</p>
      <h1>{{ d().nome }}</h1>
      <p class="periodo">{{ d().periodo }}</p>
    </div>
  </div>
</header>
